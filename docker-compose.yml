services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aurinara_platform
      POSTGRES_USER: aurinara_platform
      POSTGRES_PASSWORD: aurinara_platform
    ports:
      - "55433:5432"
    volumes:
      - platform_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurinara_platform -d aurinara_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    pull_policy: never
    user: "0"
    command: ["server", "/bitnami/minio/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9200:9000"
      - "9201:9001"
    volumes:
      - platform_object_data:/bitnami/minio/data
  create-bucket:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    depends_on:
      - minio
    volumes:
      - ./docker/minio/cors.json:/config/cors.json:ro
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done
        mc mb --ignore-existing local/aurinara-shared-objects
        mc version enable local/aurinara-shared-objects
        mc cors set local/aurinara-shared-objects /config/cors.json

  localstack:
    image: localstack/localstack:3
    ports:
      - "4567:4566"
    environment:
      SERVICES: events,sqs
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: "1"
      DEBUG: "0"
    volumes:
      - ./docker/localstack/10-platform-events.sh:/etc/localstack/init/ready.d/10-platform-events.sh:ro
      - platform_localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &application-environment
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://aurinara_platform:aurinara_platform@postgres:5432/aurinara_platform
      EVENTBRIDGE_BUS_NAME: aurinara-platform
      EVENTBRIDGE_ENDPOINT_URL: http://localstack:4566
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_ACCESS_KEY: minioadmin
      OBJECT_STORE_SECRET_KEY: minioadmin
      OBJECT_STORE_SSE_ALGORITHM: none
      REPOSITORY_OFFICE_ENABLED: "true"
      ONLYOFFICE_PUBLIC_URL: http://localhost:8083
      ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      ONLYOFFICE_PLATFORM_URL: http://host.docker.internal:8002
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-local-onlyoffice-change-me}
    depends_on:
      postgres:
        condition: service_healthy

  outbox-publisher:
    build: .
    command: ["python", "scripts/publish_outbox.py", "--watch"]
    environment: *application-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  repository-worker:
    build: .
    command: ["python", "-m", "aurinara_platform.repository_worker"]
    environment: *application-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    restart: unless-stopped
    read_only: true
    volumes:
      - platform_repository_scratch:/tmp
    security_opt:
      - no-new-privileges:true

  onlyoffice:
    image: onlyoffice/documentserver:9.3.1.2@sha256:290a0a1406a485acc8a6bc20418ac7158c5eec78b4844c218f8f975a9800ddbc
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-local-onlyoffice-change-me}
      JWT_HEADER: AuthorizationJwt
    ports:
      - "8083:80"
    volumes:
      - platform_onlyoffice_data:/var/www/onlyoffice/Data
      - platform_onlyoffice_logs:/var/log/onlyoffice
      - platform_onlyoffice_lib:/var/lib/onlyoffice
      - platform_onlyoffice_database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  platform_postgres_data:
  platform_object_data:
  platform_localstack_data:
  platform_repository_scratch:
  platform_onlyoffice_data:
  platform_onlyoffice_logs:
  platform_onlyoffice_lib:
  platform_onlyoffice_database:
