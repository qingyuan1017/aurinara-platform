AWSTemplateFormatVersion: '2010-09-09'
Description: Shared Cognito identity foundation for Aurinara Platform, Aurinara, and Aurinara EDC.

Parameters:
  Environment: {Type: String, AllowedValues: [staging, production]}
  DomainPrefix: {Type: String}
  PlatformApplicationUrl: {Type: String}
  AurinaraApplicationUrl: {Type: String}
  EdcApplicationUrl: {Type: String}
  DataKeyArn: {Type: String}
  SesSourceArn: {Type: String}
  CognitoFromAddress: {Type: String}

Conditions:
  IsProduction: !Equals [!Ref Environment, production]

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub aurinara-suite-${Environment}
      UserPoolTier: ESSENTIALS
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: 'ON'
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AdminCreateUserConfig: {AllowAdminCreateUserOnly: false}
      AccountRecoverySetting: {RecoveryMechanisms: [{Name: verified_email, Priority: 1}]}
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 3
      Schema: [{Name: email, AttributeDataType: String, Mutable: true, Required: true}]
      UserAttributeUpdateSettings: {AttributesRequireVerificationBeforeUpdate: [email]}
      VerificationMessageTemplate: {DefaultEmailOption: CONFIRM_WITH_CODE}
      EmailConfiguration:
        EmailSendingAccount: DEVELOPER
        SourceArn: !Ref SesSourceArn
        From: !Ref CognitoFromAddress
      DeletionProtection: !If [IsProduction, ACTIVE, INACTIVE]
      UserPoolTags: {'aurinara:environment': !Ref Environment, 'aurinara:owner': platform}
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties: {Domain: !Ref DomainPrefix, UserPoolId: !Ref UserPool, ManagedLoginVersion: 2}
  PlatformResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      Identifier: aurinara-platform
      Name: Aurinara Platform
      UserPoolId: !Ref UserPool
      Scopes: [{ScopeName: service, ScopeDescription: Product service access to the platform}]

  PlatformSpaClient:
    Type: AWS::Cognito::UserPoolClient
    Properties: &SpaClient
      ClientName: !Sub aurinara-platform-${Environment}-spa
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: [!Sub '${PlatformApplicationUrl}/auth/callback']
      LogoutURLs: [!Sub '${PlatformApplicationUrl}/login']
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 1
      TokenValidityUnits: {AccessToken: minutes, IdToken: minutes, RefreshToken: days}
  AurinaraSpaClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      <<: *SpaClient
      ClientName: !Sub aurinara-${Environment}-spa
      CallbackURLs: [!Sub '${AurinaraApplicationUrl}/auth/callback']
      LogoutURLs: [!Sub '${AurinaraApplicationUrl}/login']
  EdcSpaClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      <<: *SpaClient
      ClientName: !Sub aurinara-edc-${Environment}-spa
      CallbackURLs: [!Sub '${EdcApplicationUrl}/auth/cognito/callback']
      LogoutURLs: [!Sub '${EdcApplicationUrl}/login']

  PlatformBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties: {UserPoolId: !Ref UserPool, ClientId: !Ref PlatformSpaClient, UseCognitoProvidedValues: true}
  AurinaraBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties: {UserPoolId: !Ref UserPool, ClientId: !Ref AurinaraSpaClient, UseCognitoProvidedValues: true}
  EdcBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties: {UserPoolId: !Ref UserPool, ClientId: !Ref EdcSpaClient, UseCognitoProvidedValues: true}

  AurinaraServiceClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: PlatformResourceServer
    Properties: &ServiceClient
      ClientName: !Sub aurinara-${Environment}-service
      UserPoolId: !Ref UserPool
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [client_credentials]
      AllowedOAuthScopes: [aurinara-platform/service]
      EnableTokenRevocation: true
      AccessTokenValidity: 15
      TokenValidityUnits: {AccessToken: minutes}
  EdcServiceClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: PlatformResourceServer
    Properties:
      <<: *ServiceClient
      ClientName: !Sub aurinara-edc-${Environment}-service
  AurinaraServiceSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub aurinara/${Environment}/platform-service-client
      KmsKeyId: !Ref DataKeyArn
      SecretString: !Sub
        - '{"client_id":"${ClientId}","client_secret":"${ClientSecret}"}'
        - ClientId: !Ref AurinaraServiceClient
          ClientSecret: !GetAtt AurinaraServiceClient.ClientSecret
  EdcServiceSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub aurinara-edc/${Environment}/platform-service-client
      KmsKeyId: !Ref DataKeyArn
      SecretString: !Sub
        - '{"client_id":"${ClientId}","client_secret":"${ClientSecret}"}'
        - ClientId: !Ref EdcServiceClient
          ClientSecret: !GetAtt EdcServiceClient.ClientSecret

Outputs:
  UserPoolId: {Value: !Ref UserPool}
  PlatformSpaClientId: {Value: !Ref PlatformSpaClient}
  AurinaraSpaClientId: {Value: !Ref AurinaraSpaClient}
  EdcSpaClientId: {Value: !Ref EdcSpaClient}
  AurinaraServiceClientId: {Value: !Ref AurinaraServiceClient}
  EdcServiceClientId: {Value: !Ref EdcServiceClient}
  AurinaraServiceClientSecretArn: {Value: !Ref AurinaraServiceSecret}
  EdcServiceClientSecretArn: {Value: !Ref EdcServiceSecret}
  UserAudiences: {Value: !Join [',', [!Ref PlatformSpaClient, !Ref AurinaraSpaClient, !Ref EdcSpaClient]]}
  ServiceClientIds: {Value: !Join [',', [!Ref AurinaraServiceClient, !Ref EdcServiceClient]]}
  JwtIssuer: {Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'}
  JwtJwksUrl: {Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json'}
  AuthorizeUrl: {Value: !Sub 'https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/authorize'}
  TokenUrl: {Value: !Sub 'https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/token'}
  LogoutUrl: {Value: !Sub 'https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com/logout'}
  CognitoDomain: {Value: !Sub '${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com'}
