AWSTemplateFormatVersion: '2010-09-09'
Description: Shared Cognito identity foundation for Aurinara Platform, Aurinara, and Aurinara EDC.

Parameters:
  Environment: {Type: String, AllowedValues: [staging, production]}
  DomainPrefix: {Type: String}
  PlatformApplicationUrl: {Type: String}
  AurinaraApplicationUrl: {Type: String}
  EdcApplicationUrl: {Type: String}
  DataKeyArn: {Type: String}
  SesSourceArn: {Type: String, Default: ''}
  CognitoFromAddress: {Type: String, Default: ''}

Conditions:
  IsProduction: !Equals [!Ref Environment, production]
  HasCustomEmailSender: !And
    - !Not [!Equals [!Ref SesSourceArn, '']]
    - !Not [!Equals [!Ref CognitoFromAddress, '']]

Rules:
  SesSenderPairRequired:
    Assertions:
      - Assert: !Or
          - !And [!Equals [!Ref SesSourceArn, ''], !Equals [!Ref CognitoFromAddress, '']]
          - !And
            - !Not [!Equals [!Ref SesSourceArn, '']]
            - !Not [!Equals [!Ref CognitoFromAddress, '']]
        AssertDescription: SesSourceArn and CognitoFromAddress must be supplied together or both omitted.

Resources:
  IdentityRegistrationDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub aurinara-platform-${Environment}-identity-registration-dlq
      KmsMasterKeyId: !Ref DataKeyArn
      MessageRetentionPeriod: 1209600
  IdentityRegistrationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub aurinara-platform-${Environment}-identity-registration
      KmsMasterKeyId: !Ref DataKeyArn
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 120
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IdentityRegistrationDeadLetterQueue.Arn
        maxReceiveCount: 5
  IdentityRegistrationFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}
      Policies:
        - PolicyName: publish-confirmed-identities
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt IdentityRegistrationQueue.Arn
              - Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !Ref DataKeyArn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/aurinara-platform-${Environment}-identity-registration:*'
  IdentityRegistrationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub aurinara-platform-${Environment}-identity-registration
      Description: Enqueue confirmed Cognito identities for zero-access Platform registration.
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt IdentityRegistrationFunctionRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables: {QUEUE_URL: !Ref IdentityRegistrationQueue}
      Code:
        ZipFile: |
          import json
          import os
          from datetime import UTC, datetime

          import boto3

          sqs = boto3.client("sqs")


          def handler(event, context):
              if event.get("triggerSource") != "PostConfirmation_ConfirmSignUp":
                  return event
              attributes = event.get("request", {}).get("userAttributes", {})
              subject = attributes.get("sub")
              email = attributes.get("email")
              user_pool_id = event.get("userPoolId")
              if not subject or not email or not user_pool_id:
                  raise ValueError("confirmed identity is missing required attributes")
              region = os.environ["AWS_REGION"]
              message = {
                  "schema_version": "1.0.0",
                  "event_id": context.aws_request_id,
                  "issuer": f"https://cognito-idp.{region}.amazonaws.com/{user_pool_id}",
                  "subject": subject,
                  "email": email,
                  "display_name": attributes.get("name") or email,
                  "confirmed_at": datetime.now(UTC).isoformat(),
              }
              sqs.send_message(
                  QueueUrl=os.environ["QUEUE_URL"],
                  MessageBody=json.dumps(message, separators=(",", ":")),
              )
              return event
  IdentityRegistrationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/aurinara-platform-${Environment}-identity-registration
      RetentionInDays: !If [IsProduction, 365, 90]
      KmsKeyId: !Ref DataKeyArn
  IdentityRegistrationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref IdentityRegistrationFunction
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  UserPool:
    Type: AWS::Cognito::UserPool
    DependsOn: IdentityRegistrationInvokePermission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub aurinara-suite-${Environment}
      UserPoolTier: ESSENTIALS
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: 'ON'
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AdminCreateUserConfig: {AllowAdminCreateUserOnly: false}
      AccountRecoverySetting: {RecoveryMechanisms: [{Name: verified_email, Priority: 1}]}
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 3
      Schema: [{Name: email, AttributeDataType: String, Mutable: true, Required: true}]
      UserAttributeUpdateSettings: {AttributesRequireVerificationBeforeUpdate: [email]}
      VerificationMessageTemplate: {DefaultEmailOption: CONFIRM_WITH_CODE}
      LambdaConfig: {PostConfirmation: !GetAtt IdentityRegistrationFunction.Arn}
      EmailConfiguration: !If
        - HasCustomEmailSender
        - EmailSendingAccount: DEVELOPER
          SourceArn: !Ref SesSourceArn
          From: !Ref CognitoFromAddress
        - EmailSendingAccount: COGNITO_DEFAULT
      DeletionProtection: !If [IsProduction, ACTIVE, INACTIVE]
      UserPoolTags: {'aurinara:environment': !Ref Environment, 'aurinara:owner': platform}
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties: {Domain: !Ref DomainPrefix, UserPoolId: !Ref UserPool, ManagedLoginVersion: 2}
  PlatformResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      Identifier: aurinara-platform
      Name: Aurinara Platform
      UserPoolId: !Ref UserPool
      Scopes: [{ScopeName: service, ScopeDescription: Product service access to the platform}]

  PlatformSpaClient:
    Type: AWS::Cognito::UserPoolClient
    Properties: &SpaClient
      ClientName: !Sub aurinara-platform-${Environment}-spa
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: [!Sub '${PlatformApplicationUrl}/auth/callback']
      LogoutURLs: [!Sub '${PlatformApplicationUrl}/login']
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 1
      TokenValidityUnits: {AccessToken: minutes, IdToken: minutes, RefreshToken: days}
  AurinaraSpaClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      <<: *SpaClient
      ClientName: !Sub aurinara-${Environment}-spa
      CallbackURLs: [!Sub '${AurinaraApplicationUrl}/auth/callback']
      LogoutURLs: [!Sub '${AurinaraApplicationUrl}/login']
  EdcSpaClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      <<: *SpaClient
      ClientName: !Sub aurinara-edc-${Environment}-spa
      CallbackURLs: [!Sub '${EdcApplicationUrl}/auth/cognito/callback']
      LogoutURLs: [!Sub '${EdcApplicationUrl}/login']

  PlatformDevelopmentSpaClient:
    Condition: IsProduction
    Type: AWS::Cognito::UserPoolClient
    Properties:
      <<: *SpaClient
      ClientName: aurinara-platform-development-spa
      CallbackURLs: ['http://localhost:5174/auth/callback']
      LogoutURLs: ['http://localhost:5174/login']
  AurinaraDevelopmentSpaClient:
    Condition: IsProduction
    Type: AWS::Cognito::UserPoolClient
    Properties:
      <<: *SpaClient
      ClientName: aurinara-development-spa
      CallbackURLs: ['http://localhost:5173/auth/callback']
      LogoutURLs: ['http://localhost:5173/login']
  EdcDevelopmentSpaClient:
    Condition: IsProduction
    Type: AWS::Cognito::UserPoolClient
    Properties:
      <<: *SpaClient
      ClientName: aurinara-edc-development-spa
      CallbackURLs: ['http://localhost:5173/auth/cognito/callback']
      LogoutURLs: ['http://localhost:5173/login']

  PlatformBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties: {UserPoolId: !Ref UserPool, ClientId: !Ref PlatformSpaClient, UseCognitoProvidedValues: true}
  AurinaraBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties: {UserPoolId: !Ref UserPool, ClientId: !Ref AurinaraSpaClient, UseCognitoProvidedValues: true}
  EdcBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties: {UserPoolId: !Ref UserPool, ClientId: !Ref EdcSpaClient, UseCognitoProvidedValues: true}
  PlatformDevelopmentBranding:
    Condition: IsProduction
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties: {UserPoolId: !Ref UserPool, ClientId: !Ref PlatformDevelopmentSpaClient, UseCognitoProvidedValues: true}
  AurinaraDevelopmentBranding:
    Condition: IsProduction
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties: {UserPoolId: !Ref UserPool, ClientId: !Ref AurinaraDevelopmentSpaClient, UseCognitoProvidedValues: true}
  EdcDevelopmentBranding:
    Condition: IsProduction
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties: {UserPoolId: !Ref UserPool, ClientId: !Ref EdcDevelopmentSpaClient, UseCognitoProvidedValues: true}

  AurinaraServiceClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: PlatformResourceServer
    Properties: &ServiceClient
      ClientName: !Sub aurinara-${Environment}-service
      UserPoolId: !Ref UserPool
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [client_credentials]
      AllowedOAuthScopes: [aurinara-platform/service]
      EnableTokenRevocation: true
      AccessTokenValidity: 15
      TokenValidityUnits: {AccessToken: minutes}
  EdcServiceClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: PlatformResourceServer
    Properties:
      <<: *ServiceClient
      ClientName: !Sub aurinara-edc-${Environment}-service
  AurinaraServiceSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub aurinara/${Environment}/platform-service-client
      KmsKeyId: !Ref DataKeyArn
      SecretString: !Sub
        - '{"client_id":"${ClientId}","client_secret":"${ClientSecret}"}'
        - ClientId: !Ref AurinaraServiceClient
          ClientSecret: !GetAtt AurinaraServiceClient.ClientSecret
  EdcServiceSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub aurinara-edc/${Environment}/platform-service-client
      KmsKeyId: !Ref DataKeyArn
      SecretString: !Sub
        - '{"client_id":"${ClientId}","client_secret":"${ClientSecret}"}'
        - ClientId: !Ref EdcServiceClient
          ClientSecret: !GetAtt EdcServiceClient.ClientSecret

Outputs:
  UserPoolId: {Value: !Ref UserPool}
  PlatformSpaClientId: {Value: !Ref PlatformSpaClient}
  AurinaraSpaClientId: {Value: !Ref AurinaraSpaClient}
  EdcSpaClientId: {Value: !Ref EdcSpaClient}
  PlatformDevelopmentSpaClientId: {Condition: IsProduction, Value: !Ref PlatformDevelopmentSpaClient}
  AurinaraDevelopmentSpaClientId: {Condition: IsProduction, Value: !Ref AurinaraDevelopmentSpaClient}
  EdcDevelopmentSpaClientId: {Condition: IsProduction, Value: !Ref EdcDevelopmentSpaClient}
  AurinaraServiceClientId: {Value: !Ref AurinaraServiceClient}
  EdcServiceClientId: {Value: !Ref EdcServiceClient}
  AurinaraServiceClientSecretArn: {Value: !Ref AurinaraServiceSecret}
  EdcServiceClientSecretArn: {Value: !Ref EdcServiceSecret}
  UserAudiences: {Value: !Join [',', [!Ref PlatformSpaClient, !Ref AurinaraSpaClient, !Ref EdcSpaClient]]}
  ServiceClientIds: {Value: !Join [',', [!Ref AurinaraServiceClient, !Ref EdcServiceClient]]}
  JwtIssuer: {Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'}
  JwtJwksUrl: {Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json'}
  AuthorizeUrl: {Value: !Sub 'https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/authorize'}
  TokenUrl: {Value: !Sub 'https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/token'}
  LogoutUrl: {Value: !Sub 'https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com/logout'}
  CognitoDomain: {Value: !Sub '${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com'}
  IdentityRegistrationQueueArn: {Value: !GetAtt IdentityRegistrationQueue.Arn}
  IdentityRegistrationQueueUrl: {Value: !Ref IdentityRegistrationQueue}
  IdentityRegistrationDeadLetterQueueName: {Value: !GetAtt IdentityRegistrationDeadLetterQueue.QueueName}
