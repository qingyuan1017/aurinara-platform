AWSTemplateFormatVersion: '2010-09-09'
Description: Aurinara Platform ECS API, outbox publisher, migrations, ALB, and PrivateLink service.

Parameters:
  Environment: {Type: String, AllowedValues: [staging, production]}
  ServicesEnabled: {Type: String, AllowedValues: ['true', 'false'], Default: 'false'}
  ApplicationImage: {Type: String, AllowedPattern: '^.+@sha256:[0-9a-f]{64}$'}
  MigrationApplicationImage: {Type: String, AllowedPattern: '^.+@sha256:[0-9a-f]{64}$'}
  VpcId: {Type: AWS::EC2::VPC::Id}
  AppSubnetIds: {Type: List<AWS::EC2::Subnet::Id>}
  AlbSecurityGroupId: {Type: AWS::EC2::SecurityGroup::Id}
  ApiSecurityGroupId: {Type: AWS::EC2::SecurityGroup::Id}
  WorkerSecurityGroupId: {Type: AWS::EC2::SecurityGroup::Id}
  DatabaseEndpoint: {Type: String}
  DatabaseSecretArn: {Type: String}
  DataKeyArn: {Type: String}
  ObjectBucketName: {Type: String}
  EventBusName: {Type: String}
  JwtIssuer: {Type: String}
  JwtJwksUrl: {Type: String}
  PlatformSpaClientId: {Type: String}
  UserAudiences: {Type: String}
  ServiceClientIds: {Type: String}
  BrowserOrigins: {Type: String}
  MalwareScannerUrl: {Type: String, Default: ''}
  MalwareScannerTokenSecretArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
  MalwareScanRequired: {Type: String, AllowedValues: ['true', 'false'], Default: 'false'}
  PrivateApiDnsName: {Type: String}
  AurinaraConsumerVpcCidr: {Type: String}
  EdcConsumerVpcCidr: {Type: String}

Conditions:
  IsProduction: !Equals [!Ref Environment, production]
  ServicesActive: !Equals [!Ref ServicesEnabled, 'true']
  HasMalwareScanner: !Equals [!Ref MalwareScanRequired, 'true']

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub aurinara-platform-${Environment}
      ClusterSettings: [{Name: containerInsights, Value: enhanced}]
      Configuration: {ExecuteCommandConfiguration: {Logging: NONE}}
  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aurinara-platform/${Environment}/application
      RetentionInDays: !If [IsProduction, 365, 90]
      KmsKeyId: !Ref DataKeyArn
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
      Policies:
        - PolicyName: read-runtime-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'secretsmanager:GetSecretValue'
                Resource: !If
                  - HasMalwareScanner
                  - [!Ref DatabaseSecretArn, !Ref MalwareScannerTokenSecretArn]
                  - [!Ref DatabaseSecretArn]
              - {Effect: Allow, Action: ['kms:Decrypt', 'kms:DescribeKey'], Resource: !Ref DataKeyArn}
  ApplicationTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: object-and-events
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:AbortMultipartUpload, s3:ListBucketMultipartUploads, s3:ListMultipartUploadParts]
                Resource: [!Sub 'arn:${AWS::Partition}:s3:::${ObjectBucketName}', !Sub 'arn:${AWS::Partition}:s3:::${ObjectBucketName}/*']
              - {Effect: Allow, Action: ['kms:Decrypt', 'kms:Encrypt', 'kms:GenerateDataKey', 'kms:DescribeKey'], Resource: !Ref DataKeyArn}
              - {Effect: Allow, Action: 'events:PutEvents', Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/${EventBusName}'}

  InternalLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ap-${Environment}-alb
      Scheme: internal
      Type: application
      SecurityGroups: [!Ref AlbSecurityGroupId]
      Subnets: !Ref AppSubnetIds
      LoadBalancerAttributes:
        - {Key: deletion_protection.enabled, Value: !If [IsProduction, 'true', 'false']}
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}
  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8000
      TargetType: ip
      HealthCheckPath: /health/live
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes: [{Key: deregistration_delay.timeout_seconds, Value: '30'}]
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref InternalLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref ApiTargetGroup}]

  PrivateLinkLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ap-${Environment}-nlb
      Scheme: internal
      Type: network
      Subnets: !Ref AppSubnetIds
  AurinaraPrivateLinkIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref AlbSecurityGroupId, IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref AurinaraConsumerVpcCidr}
  EdcPrivateLinkIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref AlbSecurityGroupId, IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref EdcConsumerVpcCidr}
  PrivateLinkTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: Listener
    Properties:
      VpcId: !Ref VpcId
      Protocol: TCP
      Port: 80
      TargetType: alb
      Targets: [{Id: !Ref InternalLoadBalancer, Port: 80}]
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health/live
  PrivateLinkListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref PrivateLinkLoadBalancer
      Port: 80
      Protocol: TCP
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref PrivateLinkTargetGroup}]
  EndpointService:
    Type: AWS::EC2::VPCEndpointService
    Properties:
      AcceptanceRequired: false
      NetworkLoadBalancerArns: [!Ref PrivateLinkLoadBalancer]
      PrivateDnsName: !Ref PrivateApiDnsName
      SupportedIpAddressTypes: [ipv4]
  EndpointServicePermissions:
    Type: AWS::EC2::VPCEndpointServicePermissions
    Properties:
      ServiceId: !Ref EndpointService
      AllowedPrincipals: [!Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root']

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub aurinara-platform-${Environment}-api
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApplicationTaskRole.Arn
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      Volumes: [{Name: scratch}]
      ContainerDefinitions:
        - Name: api
          Image: !Ref ApplicationImage
          Command: [python, scripts/aws_entrypoint.py, uvicorn, 'aurinara_platform.main:app', --host, 0.0.0.0, --port, '8000', --workers, '2']
          Essential: true
          PortMappings: [{ContainerPort: 8000, Protocol: tcp}]
          ReadonlyRootFilesystem: true
          MountPoints: [{SourceVolume: scratch, ContainerPath: /tmp, ReadOnly: false}]
          Environment: &ApplicationEnvironment
            - {Name: ENVIRONMENT, Value: !Ref Environment}
            - {Name: DATABASE_HOST, Value: !Ref DatabaseEndpoint}
            - {Name: DATABASE_PORT, Value: '5432'}
            - {Name: DATABASE_NAME, Value: aurinara_platform}
            - {Name: DATABASE_USER, Value: aurinara_platform}
            - {Name: OIDC_ISSUER, Value: !Ref JwtIssuer}
            - {Name: OIDC_JWKS_URL, Value: !Ref JwtJwksUrl}
            - {Name: OIDC_AUDIENCE, Value: !Ref PlatformSpaClientId}
            - {Name: OIDC_USER_AUDIENCES, Value: !Ref UserAudiences}
            - {Name: OIDC_SERVICE_CLIENT_IDS, Value: !Ref ServiceClientIds}
            - {Name: OIDC_SERVICE_SCOPE, Value: aurinara-platform/service}
            - {Name: OBJECT_STORE_ENDPOINT, Value: ''}
            - {Name: OBJECT_STORE_BUCKET, Value: !Ref ObjectBucketName}
            - {Name: OBJECT_STORE_REGION, Value: !Ref AWS::Region}
            - {Name: OBJECT_STORE_ACCESS_KEY, Value: ''}
            - {Name: OBJECT_STORE_SECRET_KEY, Value: ''}
            - {Name: OBJECT_STORE_PATH_STYLE, Value: 'false'}
            - {Name: OBJECT_STORE_SSE_ALGORITHM, Value: aws:kms}
            - {Name: OBJECT_STORE_KMS_KEY_ID, Value: !Ref DataKeyArn}
            - {Name: OBJECT_LOCK_ENABLED, Value: 'true'}
            - {Name: MALWARE_SCANNER_URL, Value: !Ref MalwareScannerUrl}
            - {Name: MALWARE_SCAN_REQUIRED, Value: !Ref MalwareScanRequired}
            - {Name: EVENTBRIDGE_BUS_NAME, Value: !Ref EventBusName}
            - {Name: EVENTBRIDGE_SOURCE, Value: aurinara.platform}
            - {Name: CORS_ORIGINS, Value: !Ref BrowserOrigins}
            - {Name: BOOTSTRAP_FIRST_USER_AS_ADMIN, Value: 'false'}
          Secrets: &ApplicationSecrets
            - {Name: DATABASE_PASSWORD, ValueFrom: !Sub '${DatabaseSecretArn}:password::'}
            - !If
              - HasMalwareScanner
              - {Name: MALWARE_SCANNER_TOKEN, ValueFrom: !Ref MalwareScannerTokenSecretArn}
              - !Ref AWS::NoValue
          LinuxParameters: {InitProcessEnabled: true, Capabilities: {Drop: [ALL]}}
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref ApplicationLogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: api}}
  ApiService:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: api
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: !If [ServicesActive, 2, 0]
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration: {DeploymentCircuitBreaker: {Enable: true, Rollback: true}, MinimumHealthyPercent: 50, MaximumPercent: 200}
      NetworkConfiguration: {AwsvpcConfiguration: {AssignPublicIp: DISABLED, SecurityGroups: [!Ref ApiSecurityGroupId], Subnets: !Ref AppSubnetIds}}
      LoadBalancers: [{ContainerName: api, ContainerPort: 8000, TargetGroupArn: !Ref ApiTargetGroup}]

  PublisherTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub aurinara-platform-${Environment}-publisher
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApplicationTaskRole.Arn
      ContainerDefinitions:
        - Name: publisher
          Image: !Ref ApplicationImage
          Command: [python, scripts/aws_entrypoint.py, python, scripts/publish_outbox.py, --watch]
          Essential: true
          ReadonlyRootFilesystem: true
          Environment: *ApplicationEnvironment
          Secrets: *ApplicationSecrets
          LinuxParameters: {InitProcessEnabled: true, Capabilities: {Drop: [ALL]}}
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref ApplicationLogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: publisher}}
  PublisherService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: outbox-publisher
      Cluster: !Ref Cluster
      TaskDefinition: !Ref PublisherTaskDefinition
      DesiredCount: !If [ServicesActive, !If [IsProduction, 2, 1], 0]
      LaunchType: FARGATE
      DeploymentConfiguration: {DeploymentCircuitBreaker: {Enable: true, Rollback: true}, MinimumHealthyPercent: 50, MaximumPercent: 200}
      NetworkConfiguration: {AwsvpcConfiguration: {AssignPublicIp: DISABLED, SecurityGroups: [!Ref WorkerSecurityGroupId], Subnets: !Ref AppSubnetIds}}
  MigrationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub aurinara-platform-${Environment}-migration
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApplicationTaskRole.Arn
      ContainerDefinitions:
        - Name: migration
          Image: !Ref MigrationApplicationImage
          Command: [python, scripts/aws_entrypoint.py, alembic, upgrade, head]
          Essential: true
          ReadonlyRootFilesystem: true
          Environment: *ApplicationEnvironment
          Secrets: *ApplicationSecrets
          LinuxParameters: {InitProcessEnabled: true, Capabilities: {Drop: [ALL]}}
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref ApplicationLogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: migration}}

  ApiScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MinCapacity: !If [ServicesActive, 2, 0]
      MaxCapacity: 10
      ResourceId: !Join ['/', [service, !Ref Cluster, !GetAtt ApiService.Name]]
      RoleARN: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
  ApiScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: api-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ApiScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 55
        PredefinedMetricSpecification: {PredefinedMetricType: ECSServiceAverageCPUUtilization}

Outputs:
  ClusterName: {Value: !Ref Cluster}
  ApiServiceName: {Value: !GetAtt ApiService.Name}
  MigrationTaskDefinitionArn: {Value: !Ref MigrationTaskDefinition}
  AlbArn: {Value: !Ref InternalLoadBalancer}
  AlbDnsName: {Value: !GetAtt InternalLoadBalancer.DNSName}
  AlbFullName: {Value: !GetAtt InternalLoadBalancer.LoadBalancerFullName}
  ApiTargetGroupFullName: {Value: !GetAtt ApiTargetGroup.TargetGroupFullName}
  PrivateLinkServiceId: {Value: !Ref EndpointService}
  PrivateLinkServiceName: {Value: !Sub 'com.amazonaws.vpce.${AWS::Region}.${EndpointService}'}
  PrivateLinkNlbDnsName: {Value: !GetAtt PrivateLinkLoadBalancer.DNSName}
