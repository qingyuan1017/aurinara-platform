AWSTemplateFormatVersion: '2010-09-09'
Description: Aurinara Platform ECS API, outbox publisher, migrations, ALB, and PrivateLink service.

Parameters:
  Environment: {Type: String, AllowedValues: [staging, production]}
  DeploymentProfile: {Type: String, AllowedValues: [standard, budget], Default: standard}
  ServicesEnabled: {Type: String, AllowedValues: ['true', 'false'], Default: 'false'}
  ApplicationImage: {Type: String, AllowedPattern: '^.+@sha256:[0-9a-f]{64}$'}
  MigrationApplicationImage: {Type: String, AllowedPattern: '^.+@sha256:[0-9a-f]{64}$'}
  WorkspaceImage: {Type: String, AllowedPattern: '^.+@sha256:[0-9a-f]{64}$'}
  VpcId: {Type: AWS::EC2::VPC::Id}
  AppSubnetIds: {Type: List<AWS::EC2::Subnet::Id>}
  AlbSecurityGroupId: {Type: AWS::EC2::SecurityGroup::Id}
  ApiSecurityGroupId: {Type: AWS::EC2::SecurityGroup::Id}
  WorkspaceSecurityGroupId: {Type: AWS::EC2::SecurityGroup::Id}
  WorkerSecurityGroupId: {Type: AWS::EC2::SecurityGroup::Id}
  OfficeSecurityGroupId: {Type: AWS::EC2::SecurityGroup::Id}
  DatabaseEndpoint: {Type: String}
  DatabaseSecretArn: {Type: String}
  DataKeyArn: {Type: String}
  ObjectBucketName: {Type: String}
  WorkspaceBucketName: {Type: String}
  WorkspaceCallbackSecretArn: {Type: String}
  EventBusName: {Type: String}
  JwtIssuer: {Type: String}
  JwtJwksUrl: {Type: String}
  PlatformSpaClientId: {Type: String}
  AurinaraSpaClientId: {Type: String}
  EdcSpaClientId: {Type: String}
  UserPoolId: {Type: String}
  UserAudiences: {Type: String}
  ServiceClientIds: {Type: String}
  AurinaraServiceClientId: {Type: String}
  EdcServiceClientId: {Type: String}
  IdentityRegistrationQueueArn: {Type: String}
  IdentityRegistrationQueueUrl: {Type: String}
  BrowserOrigins: {Type: String}
  PlatformPublicUrl: {Type: String}
  OfficeDomain: {Type: String}
  OnlyOfficeImage:
    Type: String
    AllowedPattern: '^onlyoffice/documentserver:[^@]+@sha256:[0-9a-f]{64}$'
  OnlyOfficeJwtSecretArn: {Type: String}
  OnlyOfficeFileSystemId: {Type: String}
  OnlyOfficeDataAccessPointId: {Type: String}
  OnlyOfficeLibAccessPointId: {Type: String}
  OnlyOfficeDatabaseAccessPointId: {Type: String}
  OnlyOfficeLogsAccessPointId: {Type: String}
  MalwareScannerUrl: {Type: String, Default: ''}
  MalwareScannerTokenSecretArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
  MalwareScanRequired: {Type: String, AllowedValues: ['true', 'false'], Default: 'false'}
  PrivateApiDnsName: {Type: String}
  AurinaraConsumerVpcCidr: {Type: String}
  EdcConsumerVpcCidr: {Type: String}

Conditions:
  IsProduction: !Equals [!Ref Environment, production]
  IsBudget: !Equals [!Ref DeploymentProfile, budget]
  IsStandard: !Not [!Condition IsBudget]
  ServicesActive: !Equals [!Ref ServicesEnabled, 'true']
  ApplicationImageReady: !Equals [!Ref ApplicationImage, !Ref MigrationApplicationImage]
  NewApplicationServicesActive: !And
    - !Condition ServicesActive
    - !Condition ApplicationImageReady
  HasMalwareScanner: !Equals [!Ref MalwareScanRequired, 'true']

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub aurinara-platform-${Environment}
      ClusterSettings: [{Name: containerInsights, Value: !If [IsBudget, disabled, enhanced]}]
      Configuration: {ExecuteCommandConfiguration: {Logging: NONE}}
  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aurinara-platform/${Environment}/application
      RetentionInDays: !If [IsBudget, 30, !If [IsProduction, 365, 90]]
      KmsKeyId: !Ref DataKeyArn
  WorkspaceLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RetentionInDays: !If [IsBudget, 30, !If [IsProduction, 365, 90]]
      KmsKeyId: !Ref DataKeyArn
  WorkspaceSyncFailureMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WorkspaceLogGroup
      FilterPattern: '{ $.event = "workspace_sync" && $.state = "failed" }'
      MetricTransformations:
        - {MetricNamespace: Aurinara Platform, MetricName: WorkspaceSyncFailures, MetricValue: '1', DefaultValue: 0, Unit: Count}
  WorkspaceQuotaMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WorkspaceLogGroup
      FilterPattern: '{ $.event = "workspace_sync" && $.state = "quota_exceeded" }'
      MetricTransformations:
        - {MetricNamespace: Aurinara Platform, MetricName: WorkspaceQuotaEvents, MetricValue: '1', DefaultValue: 0, Unit: Count}
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
      Policies:
        - PolicyName: read-runtime-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'secretsmanager:GetSecretValue'
                Resource: !If
                  - HasMalwareScanner
                  - [!Ref DatabaseSecretArn, !Ref MalwareScannerTokenSecretArn, !Ref OnlyOfficeJwtSecretArn, !Ref WorkspaceCallbackSecretArn]
                  - [!Ref DatabaseSecretArn, !Ref OnlyOfficeJwtSecretArn, !Ref WorkspaceCallbackSecretArn]
              - {Effect: Allow, Action: ['kms:Decrypt', 'kms:DescribeKey'], Resource: !Ref DataKeyArn}
  ApplicationTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: object-and-events
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:AbortMultipartUpload, s3:ListBucketMultipartUploads, s3:ListMultipartUploadParts]
                Resource: [!Sub 'arn:${AWS::Partition}:s3:::${ObjectBucketName}', !Sub 'arn:${AWS::Partition}:s3:::${ObjectBucketName}/*']
              - {Effect: Allow, Action: ['kms:Decrypt', 'kms:Encrypt', 'kms:GenerateDataKey', 'kms:DescribeKey'], Resource: !Ref DataKeyArn}
              - {Effect: Allow, Action: 'events:PutEvents', Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/${EventBusName}'}
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: !Ref IdentityRegistrationQueueArn
              - Effect: Allow
                Action: cognito-idp:ListUsers
                Resource: !Sub 'arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}'
              - Effect: Allow
                Action: [bedrock-agentcore:ListEvents, bedrock-agentcore:ListMemories]
                Resource: '*'

  WorkspaceTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
      Policies:
        - PolicyName: workspace-session-environment
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${WorkspaceBucketName}/session-env/*'
              - {Effect: Allow, Action: ['kms:Decrypt', 'kms:DescribeKey'], Resource: !Ref DataKeyArn}

  WorkspaceSyncRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 10800
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {AWS: !GetAtt ApplicationTaskRole.Arn}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: workspace-persistence
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${WorkspaceBucketName}'
                Condition: {StringLike: {'s3:prefix': ['workspaces/*']}}
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:AbortMultipartUpload, s3:ListMultipartUploadParts]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${WorkspaceBucketName}/workspaces/*'
              - {Effect: Allow, Action: ['kms:Decrypt', 'kms:Encrypt', 'kms:GenerateDataKey', 'kms:DescribeKey'], Resource: !Ref DataKeyArn}

  InternalLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ap-${Environment}-alb
      Scheme: internal
      Type: application
      SecurityGroups: [!Ref AlbSecurityGroupId]
      Subnets: !Ref AppSubnetIds
      LoadBalancerAttributes:
        - {Key: deletion_protection.enabled, Value: !If [IsProduction, 'true', 'false']}
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}
  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8000
      TargetType: ip
      HealthCheckPath: /health/live
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes: [{Key: deregistration_delay.timeout_seconds, Value: '30'}]
  OfficeTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 80
      TargetType: ip
      HealthCheckPath: /healthcheck
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes: [{Key: deregistration_delay.timeout_seconds, Value: '60'}]
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref InternalLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref ApiTargetGroup}]
  OfficeListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 10
      Conditions:
        - Field: host-header
          HostHeaderConfig: {Values: [!Ref OfficeDomain]}
      Actions: [{Type: forward, TargetGroupArn: !Ref OfficeTargetGroup}]

  PrivateLinkLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Condition: IsStandard
    Properties:
      Name: !Sub ap-${Environment}-nlb
      Scheme: internal
      Type: network
      Subnets: !Ref AppSubnetIds
  AurinaraPrivateLinkIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: IsStandard
    Properties: {GroupId: !Ref AlbSecurityGroupId, IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref AurinaraConsumerVpcCidr}
  EdcPrivateLinkIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: IsStandard
    Properties: {GroupId: !Ref AlbSecurityGroupId, IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref EdcConsumerVpcCidr}
  PrivateLinkTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: IsStandard
    DependsOn: Listener
    Properties:
      VpcId: !Ref VpcId
      Protocol: TCP
      Port: 80
      TargetType: alb
      Targets: [{Id: !Ref InternalLoadBalancer, Port: 80}]
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health/live
  PrivateLinkListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: IsStandard
    Properties:
      LoadBalancerArn: !Ref PrivateLinkLoadBalancer
      Port: 80
      Protocol: TCP
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref PrivateLinkTargetGroup}]
  EndpointService:
    Type: AWS::EC2::VPCEndpointService
    Condition: IsStandard
    Properties:
      AcceptanceRequired: false
      NetworkLoadBalancerArns: [!Ref PrivateLinkLoadBalancer]
      PrivateDnsName: !Ref PrivateApiDnsName
      SupportedIpAddressTypes: [ipv4]
  EndpointServicePermissions:
    Type: AWS::EC2::VPCEndpointServicePermissions
    Condition: IsStandard
    Properties:
      ServiceId: !Ref EndpointService
      AllowedPrincipals: [!Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root']

  WorkspaceTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub aurinara-platform-${Environment}-workspace
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt WorkspaceTaskExecutionRole.Arn
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      Volumes: [{Name: workspace-data}]
      ContainerDefinitions:
        - Name: workspace-sync
          Image: !Ref WorkspaceImage
          Command: [workspace-sync]
          Essential: true
          User: coder
          Cpu: 128
          MemoryReservation: 256
          StopTimeout: 120
          MountPoints: [{SourceVolume: workspace-data, ContainerPath: /workspace, ReadOnly: false}]
          HealthCheck:
            Command: [CMD-SHELL, 'test -f /workspace/.aurinara-ready || exit 1']
            Interval: 10
            Timeout: 5
            Retries: 10
            StartPeriod: 10
          LinuxParameters: {InitProcessEnabled: true, Capabilities: {Drop: [ALL]}}
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref WorkspaceLogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: sync}}
        - Name: workspace-ide
          Image: !Ref WorkspaceImage
          Command: [workspace-ide]
          Essential: true
          User: coder
          Cpu: 896
          MemoryReservation: 1536
          StopTimeout: 120
          DependsOn: [{ContainerName: workspace-sync, Condition: HEALTHY}]
          PortMappings: [{ContainerPort: 8080, Protocol: tcp}]
          MountPoints: [{SourceVolume: workspace-data, ContainerPath: /workspace, ReadOnly: false}]
          HealthCheck:
            Command: [CMD-SHELL, 'curl -fsS http://localhost:8080/healthz || exit 1']
            Interval: 30
            Timeout: 5
            Retries: 5
            StartPeriod: 60
          LinuxParameters: {InitProcessEnabled: true, Capabilities: {Drop: [ALL]}}
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref WorkspaceLogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: ide}}

  WorkspaceControlPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: workspace-control
      Roles: [!Ref ApplicationTaskRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Action: ecs:RunTask, Resource: !Ref WorkspaceTaskDefinition}
          - Effect: Allow
            Action: [ecs:DescribeTasks, ecs:StopTask, ecs:ListTasks]
            Resource: '*'
            Condition: {ArnEquals: {'ecs:cluster': !GetAtt Cluster.Arn}}
          - Effect: Allow
            Action: ecs:TagResource
            Resource: '*'
            Condition: {StringEquals: {'ecs:CreateAction': RunTask}}
          - {Effect: Allow, Action: iam:PassRole, Resource: !GetAtt WorkspaceTaskExecutionRole.Arn}
          - {Effect: Allow, Action: sts:AssumeRole, Resource: !GetAtt WorkspaceSyncRole.Arn}
          - Effect: Allow
            Action: [s3:PutObject, s3:DeleteObject]
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${WorkspaceBucketName}/session-env/*'
          - {Effect: Allow, Action: ['kms:Decrypt', 'kms:Encrypt', 'kms:GenerateDataKey', 'kms:DescribeKey'], Resource: !Ref DataKeyArn}

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub aurinara-platform-${Environment}-api
      Cpu: !If [IsBudget, '512', '1024']
      Memory: !If [IsBudget, '1024', '2048']
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApplicationTaskRole.Arn
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      Volumes: [{Name: scratch}]
      ContainerDefinitions:
        - Name: api
          Image: !Ref ApplicationImage
          Command: !If
            - IsBudget
            - [python, scripts/aws_entrypoint.py, uvicorn, 'aurinara_platform.main:app', --host, 0.0.0.0, --port, '8000', --workers, '1']
            - [python, scripts/aws_entrypoint.py, uvicorn, 'aurinara_platform.main:app', --host, 0.0.0.0, --port, '8000', --workers, '2']
          Essential: true
          PortMappings: [{ContainerPort: 8000, Protocol: tcp}]
          ReadonlyRootFilesystem: true
          MountPoints: [{SourceVolume: scratch, ContainerPath: /tmp, ReadOnly: false}]
          Environment: &ApplicationEnvironment
            - {Name: ENVIRONMENT, Value: !Ref Environment}
            - {Name: DATABASE_HOST, Value: !Ref DatabaseEndpoint}
            - {Name: DATABASE_PORT, Value: '5432'}
            - {Name: DATABASE_NAME, Value: aurinara_platform}
            - {Name: DATABASE_USER, Value: aurinara_platform}
            - {Name: OIDC_ISSUER, Value: !Ref JwtIssuer}
            - {Name: OIDC_JWKS_URL, Value: !Ref JwtJwksUrl}
            - {Name: OIDC_AUDIENCE, Value: !Ref PlatformSpaClientId}
            - {Name: OIDC_USER_AUDIENCES, Value: !Ref UserAudiences}
            - Name: PLAYGROUND_PRODUCT_AUDIENCES
              Value: !Sub 'platform=${PlatformSpaClientId};aurinara=${AurinaraSpaClientId};aurinara-edc=${EdcSpaClientId}'
            - {Name: WORKSPACE_ENABLED, Value: 'true'}
            - {Name: WORKSPACE_RUNTIME_MODE, Value: ecs}
            - Name: WORKSPACE_PRODUCT_AUDIENCES
              Value: !Sub 'platform=${PlatformSpaClientId};aurinara=${AurinaraSpaClientId};aurinara-edc=${EdcSpaClientId}'
            - {Name: WORKSPACE_PUBLIC_BASE_URL, Value: !Ref PlatformPublicUrl}
            - {Name: WORKSPACE_CALLBACK_BASE_URL, Value: !Ref PlatformPublicUrl}
            - {Name: WORKSPACE_CLUSTER, Value: !Ref Cluster}
            - {Name: WORKSPACE_TASK_DEFINITION, Value: !Ref WorkspaceTaskDefinition}
            - {Name: WORKSPACE_TASK_FAMILY, Value: !Sub 'aurinara-platform-${Environment}-workspace'}
            - {Name: WORKSPACE_SUBNET_IDS, Value: !Join [',', !Ref AppSubnetIds]}
            - {Name: WORKSPACE_SECURITY_GROUP_ID, Value: !Ref WorkspaceSecurityGroupId}
            - {Name: WORKSPACE_BUCKET, Value: !Ref WorkspaceBucketName}
            - {Name: WORKSPACE_SYNC_ROLE_ARN, Value: !GetAtt WorkspaceSyncRole.Arn}
            - {Name: WORKSPACE_REGION, Value: !Ref AWS::Region}
            - {Name: WORKSPACE_SESSION_SECONDS, Value: '7200'}
            - {Name: WORKSPACE_SYNC_CREDENTIAL_SECONDS, Value: '8100'}
            - {Name: WORKSPACE_LAUNCH_GRANT_SECONDS, Value: '60'}
            - {Name: WORKSPACE_PROXY_CACHE_SECONDS, Value: '15'}
            - {Name: WORKSPACE_MAX_RUNNING, Value: '10'}
            - {Name: WORKSPACE_QUOTA_BYTES, Value: '5368709120'}
            - {Name: WORKSPACE_SYNC_INTERVAL_SECONDS, Value: '60'}
            - {Name: OIDC_SERVICE_CLIENT_IDS, Value: !Ref ServiceClientIds}
            - {Name: OIDC_SERVICE_SCOPE, Value: aurinara-platform/service}
            - {Name: OBJECT_STORE_ENDPOINT, Value: ''}
            - {Name: OBJECT_STORE_BUCKET, Value: !Ref ObjectBucketName}
            - {Name: OBJECT_STORE_REGION, Value: !Ref AWS::Region}
            - {Name: OBJECT_STORE_ACCESS_KEY, Value: ''}
            - {Name: OBJECT_STORE_SECRET_KEY, Value: ''}
            - {Name: OBJECT_STORE_PATH_STYLE, Value: 'false'}
            - {Name: OBJECT_STORE_SSE_ALGORITHM, Value: aws:kms}
            - {Name: OBJECT_STORE_KMS_KEY_ID, Value: !Ref DataKeyArn}
            - {Name: OBJECT_LOCK_ENABLED, Value: 'true'}
            - {Name: MALWARE_SCANNER_URL, Value: !Ref MalwareScannerUrl}
            - {Name: MALWARE_SCAN_REQUIRED, Value: !Ref MalwareScanRequired}
            - {Name: EVENTBRIDGE_BUS_NAME, Value: !Ref EventBusName}
            - {Name: EVENTBRIDGE_SOURCE, Value: aurinara.platform}
            - {Name: IDENTITY_REGISTRATION_QUEUE_URL, Value: !Ref IdentityRegistrationQueueUrl}
            - {Name: CORS_ORIGINS, Value: !Ref BrowserOrigins}
            - {Name: BOOTSTRAP_FIRST_USER_AS_ADMIN, Value: 'false'}
            - {Name: REPOSITORY_RICH_PREVIEW_ENABLED, Value: 'true'}
            - {Name: REPOSITORY_CONVERSION_ENABLED, Value: 'true'}
            - {Name: REPOSITORY_PDF_ANNOTATIONS_ENABLED, Value: 'true'}
            - {Name: REPOSITORY_OFFICE_ENABLED, Value: 'true'}
            - {Name: ONLYOFFICE_PUBLIC_URL, Value: !Sub 'https://${OfficeDomain}'}
            - {Name: ONLYOFFICE_INTERNAL_URL, Value: !Sub 'https://${OfficeDomain}'}
            - {Name: ONLYOFFICE_PLATFORM_URL, Value: !Ref PlatformPublicUrl}
          Secrets: &ApplicationSecrets
            - {Name: DATABASE_PASSWORD, ValueFrom: !Sub '${DatabaseSecretArn}:password::'}
            - {Name: ONLYOFFICE_JWT_SECRET, ValueFrom: !Ref OnlyOfficeJwtSecretArn}
            - {Name: WORKSPACE_CALLBACK_SECRET, ValueFrom: !Ref WorkspaceCallbackSecretArn}
            - !If
              - HasMalwareScanner
              - {Name: MALWARE_SCANNER_TOKEN, ValueFrom: !Ref MalwareScannerTokenSecretArn}
              - !Ref AWS::NoValue
          LinuxParameters: {InitProcessEnabled: true, Capabilities: {Drop: [ALL]}}
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref ApplicationLogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: api}}
  ApiService:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: api
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: !If [ServicesActive, !If [IsBudget, 1, 2], 0]
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration: {DeploymentCircuitBreaker: {Enable: true, Rollback: true}, MinimumHealthyPercent: 50, MaximumPercent: 200}
      NetworkConfiguration: {AwsvpcConfiguration: {AssignPublicIp: DISABLED, SecurityGroups: [!Ref ApiSecurityGroupId], Subnets: !Ref AppSubnetIds}}
      LoadBalancers: [{ContainerName: api, ContainerPort: 8000, TargetGroupArn: !Ref ApiTargetGroup}]

  RepositoryWorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub aurinara-platform-${Environment}-repository-worker
      Cpu: '2048'
      Memory: '4096'
      EphemeralStorage: {SizeInGiB: 50}
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApplicationTaskRole.Arn
      ContainerDefinitions:
        - Name: repository-worker
          Image: !Ref ApplicationImage
          Command: [python, scripts/aws_entrypoint.py, python, -m, aurinara_platform.repository_worker]
          Essential: true
          ReadonlyRootFilesystem: true
          MountPoints: [{SourceVolume: scratch, ContainerPath: /tmp, ReadOnly: false}]
          Environment: *ApplicationEnvironment
          Secrets: *ApplicationSecrets
          LinuxParameters: {InitProcessEnabled: true, Capabilities: {Drop: [ALL]}}
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref ApplicationLogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: repository-worker}}
      Volumes: [{Name: scratch}]
  RepositoryWorkerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: repository-worker
      Cluster: !Ref Cluster
      TaskDefinition: !Ref RepositoryWorkerTaskDefinition
      DesiredCount: !If [NewApplicationServicesActive, 1, 0]
      LaunchType: FARGATE
      DeploymentConfiguration: {DeploymentCircuitBreaker: {Enable: true, Rollback: true}, MinimumHealthyPercent: 0, MaximumPercent: 200}
      NetworkConfiguration: {AwsvpcConfiguration: {AssignPublicIp: DISABLED, SecurityGroups: [!Ref WorkerSecurityGroupId], Subnets: !Ref AppSubnetIds}}

  OnlyOfficeTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub aurinara-platform-${Environment}-onlyoffice
      Cpu: '2048'
      Memory: '4096'
      EphemeralStorage: {SizeInGiB: 50}
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      Volumes:
        - Name: office-data
          EFSVolumeConfiguration: {FilesystemId: !Ref OnlyOfficeFileSystemId, TransitEncryption: ENABLED, AuthorizationConfig: {AccessPointId: !Ref OnlyOfficeDataAccessPointId}}
        - Name: office-lib
          EFSVolumeConfiguration: {FilesystemId: !Ref OnlyOfficeFileSystemId, TransitEncryption: ENABLED, AuthorizationConfig: {AccessPointId: !Ref OnlyOfficeLibAccessPointId}}
        - Name: office-database
          EFSVolumeConfiguration: {FilesystemId: !Ref OnlyOfficeFileSystemId, TransitEncryption: ENABLED, AuthorizationConfig: {AccessPointId: !Ref OnlyOfficeDatabaseAccessPointId}}
        - Name: office-logs
          EFSVolumeConfiguration: {FilesystemId: !Ref OnlyOfficeFileSystemId, TransitEncryption: ENABLED, AuthorizationConfig: {AccessPointId: !Ref OnlyOfficeLogsAccessPointId}}
      ContainerDefinitions:
        - Name: onlyoffice
          Image: !Ref OnlyOfficeImage
          Essential: true
          PortMappings: [{ContainerPort: 80, Protocol: tcp}]
          Environment:
            - {Name: JWT_ENABLED, Value: 'true'}
            - {Name: JWT_HEADER, Value: AuthorizationJwt}
          Secrets:
            - {Name: JWT_SECRET, ValueFrom: !Ref OnlyOfficeJwtSecretArn}
          MountPoints:
            - {SourceVolume: office-data, ContainerPath: /var/www/onlyoffice/Data, ReadOnly: false}
            - {SourceVolume: office-lib, ContainerPath: /var/lib/onlyoffice, ReadOnly: false}
            - {SourceVolume: office-database, ContainerPath: /var/lib/postgresql, ReadOnly: false}
            - {SourceVolume: office-logs, ContainerPath: /var/log/onlyoffice, ReadOnly: false}
          HealthCheck:
            Command: [CMD-SHELL, 'curl -fsS http://localhost/healthcheck || exit 1']
            Interval: 30
            Timeout: 5
            Retries: 5
            StartPeriod: 180
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref ApplicationLogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: onlyoffice}}
  OnlyOfficeService:
    Type: AWS::ECS::Service
    DependsOn: OfficeListenerRule
    Properties:
      ServiceName: onlyoffice
      Cluster: !Ref Cluster
      TaskDefinition: !Ref OnlyOfficeTaskDefinition
      DesiredCount: !If [ServicesActive, 1, 0]
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 300
      DeploymentConfiguration: {DeploymentCircuitBreaker: {Enable: true, Rollback: true}, MinimumHealthyPercent: 0, MaximumPercent: 100}
      NetworkConfiguration: {AwsvpcConfiguration: {AssignPublicIp: DISABLED, SecurityGroups: [!Ref OfficeSecurityGroupId], Subnets: !Ref AppSubnetIds}}
      LoadBalancers: [{ContainerName: onlyoffice, ContainerPort: 80, TargetGroupArn: !Ref OfficeTargetGroup}]

  PublisherTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub aurinara-platform-${Environment}-publisher
      Cpu: !If [IsBudget, '256', '512']
      Memory: !If [IsBudget, '512', '1024']
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApplicationTaskRole.Arn
      ContainerDefinitions:
        - Name: publisher
          Image: !Ref ApplicationImage
          Command: [python, scripts/aws_entrypoint.py, python, scripts/publish_outbox.py, --watch]
          Essential: true
          ReadonlyRootFilesystem: true
          Environment: *ApplicationEnvironment
          Secrets: *ApplicationSecrets
          LinuxParameters: {InitProcessEnabled: true, Capabilities: {Drop: [ALL]}}
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref ApplicationLogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: publisher}}
  PublisherService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: outbox-publisher
      Cluster: !Ref Cluster
      TaskDefinition: !Ref PublisherTaskDefinition
      DesiredCount: !If [ServicesActive, !If [IsBudget, 1, !If [IsProduction, 2, 1]], 0]
      LaunchType: FARGATE
      DeploymentConfiguration: {DeploymentCircuitBreaker: {Enable: true, Rollback: true}, MinimumHealthyPercent: 50, MaximumPercent: 200}
      NetworkConfiguration: {AwsvpcConfiguration: {AssignPublicIp: DISABLED, SecurityGroups: [!Ref WorkerSecurityGroupId], Subnets: !Ref AppSubnetIds}}
  IdentityRegistrationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub aurinara-platform-${Environment}-identity-registration
      Cpu: !If [IsBudget, '256', '512']
      Memory: !If [IsBudget, '512', '1024']
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApplicationTaskRole.Arn
      ContainerDefinitions:
        - Name: identity-registration
          Image: !Ref ApplicationImage
          Command: [python, scripts/aws_entrypoint.py, python, scripts/sync_cognito_users.py, --watch]
          Essential: true
          ReadonlyRootFilesystem: true
          Environment: *ApplicationEnvironment
          Secrets: *ApplicationSecrets
          LinuxParameters: {InitProcessEnabled: true, Capabilities: {Drop: [ALL]}}
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref ApplicationLogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: identity-registration}}
  IdentityRegistrationService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: identity-registration
      Cluster: !Ref Cluster
      TaskDefinition: !Ref IdentityRegistrationTaskDefinition
      # Deployment first registers the migration image while existing services keep
      # their old digest. Start this new worker only after the second phase switches
      # ApplicationImage to that successfully migrated image.
      DesiredCount: !If [NewApplicationServicesActive, 1, 0]
      LaunchType: FARGATE
      DeploymentConfiguration: {DeploymentCircuitBreaker: {Enable: true, Rollback: true}, MinimumHealthyPercent: 0, MaximumPercent: 200}
      NetworkConfiguration: {AwsvpcConfiguration: {AssignPublicIp: DISABLED, SecurityGroups: [!Ref WorkerSecurityGroupId], Subnets: !Ref AppSubnetIds}}

  MigrationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub aurinara-platform-${Environment}-migration
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApplicationTaskRole.Arn
      ContainerDefinitions:
        - Name: migration
          Image: !Ref MigrationApplicationImage
          Command:
            - python
            - scripts/aws_entrypoint.py
            - sh
            - -c
            - !Sub >-
                alembic upgrade head && python scripts/bootstrap_service_accounts.py
                --aurinara-client-id ${AurinaraServiceClientId}
                --edc-client-id ${EdcServiceClientId} && python scripts/bootstrap_default_access.py
                && python scripts/sync_cognito_users.py
                --backfill --user-pool-id ${UserPoolId}
          Essential: true
          ReadonlyRootFilesystem: true
          Environment: *ApplicationEnvironment
          Secrets: *ApplicationSecrets
          LinuxParameters: {InitProcessEnabled: true, Capabilities: {Drop: [ALL]}}
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref ApplicationLogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: migration}}

  ApiScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Condition: IsStandard
    Properties:
      MinCapacity: !If [ServicesActive, 2, 0]
      MaxCapacity: 10
      ResourceId: !Join ['/', [service, !Ref Cluster, !GetAtt ApiService.Name]]
      RoleARN: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
  ApiScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: IsStandard
    Properties:
      PolicyName: api-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ApiScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 55
        PredefinedMetricSpecification: {PredefinedMetricType: ECSServiceAverageCPUUtilization}

Outputs:
  ClusterName: {Value: !Ref Cluster}
  ApiServiceName: {Value: !GetAtt ApiService.Name}
  RepositoryWorkerServiceName: {Value: !GetAtt RepositoryWorkerService.Name}
  OnlyOfficeServiceName: {Value: !GetAtt OnlyOfficeService.Name}
  MigrationTaskDefinitionArn: {Value: !Ref MigrationTaskDefinition}
  WorkspaceTaskDefinitionArn: {Value: !Ref WorkspaceTaskDefinition}
  WorkspaceSyncRoleArn: {Value: !GetAtt WorkspaceSyncRole.Arn}
  AlbArn: {Value: !Ref InternalLoadBalancer}
  AlbDnsName: {Value: !GetAtt InternalLoadBalancer.DNSName}
  AlbFullName: {Value: !GetAtt InternalLoadBalancer.LoadBalancerFullName}
  ApiTargetGroupFullName: {Value: !GetAtt ApiTargetGroup.TargetGroupFullName}
  OfficeTargetGroupFullName: {Value: !GetAtt OfficeTargetGroup.TargetGroupFullName}
  ListenerArn: {Value: !Ref Listener}
  AlbSecurityGroupId: {Value: !Ref AlbSecurityGroupId}
  PrivateLinkServiceId: {Condition: IsStandard, Value: !Ref EndpointService}
  PrivateLinkServiceName: {Condition: IsStandard, Value: !Sub 'com.amazonaws.vpce.${AWS::Region}.${EndpointService}'}
  PrivateLinkNlbDnsName: {Condition: IsStandard, Value: !GetAtt PrivateLinkLoadBalancer.DNSName}
