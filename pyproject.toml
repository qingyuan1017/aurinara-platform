[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aurinara-platform"
version = "0.1.0"
description = "Shared identity, study, authorization, and object control plane for Aurinara"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "boto3>=1.35,<2",
  "duckdb>=1.4,<2",
  "fastapi[standard]>=0.115,<1",
  "httpx>=0.28,<1",
  "msgpack>=1.2.1,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.10,<3",
  "pypdf>=6,<7",
  "reportlab>=4.4,<5",
  "sqlalchemy>=2.0,<3",
  "urllib3>=2.8.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "websockets==17.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
